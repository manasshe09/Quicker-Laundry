    <path 
      d="M -4,14 C -4,17 -2,19 1,19 C -2,19 -4,21 -4,24 C -4,21 -6,19 -9,19 C -6,19 -4,17 -4,14 Z" 
      fill="#22399A"
    />
  </g>

