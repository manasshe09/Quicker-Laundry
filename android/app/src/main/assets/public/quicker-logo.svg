  <!-- Subtitle: "LAUNDRY & DRYCLEANING" -->
  <text 
    x="136" 
    y="148" 
    fill="#22399A" 
    font-size="20.5" 
    font-weight="900" 
    class="quicker-sub-text"
  >LAUNDRY&amp; DRYCLEANING</text>
</svg>
