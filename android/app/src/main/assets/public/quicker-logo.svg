<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Fredoka:wght@700&amp;family=Nunito:wght@900&amp;display=swap');
      .quicker-brand-text {
        font-family: 'Fredoka', 'Nunito', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .quicker-sub-text {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- Sparkle Badge above 'er' -->
  <g transform="translate(372, 44)">
    <!-- Crescent / Circular bubble outline -->
    <path 
      d="M -12,30 C -26,18 -30,-8 -16,-24 C -2,-40 24,-40 38,-24 C 52,-8 48,20 32,32 C 26,37 18,40 10,40" 
      stroke="#22399A" 
      stroke-width="5" 
      stroke-linecap="round" 
      fill="none"
    />
    <!-- Large 4-Point Diamond Sparkle -->
    <path 
      d="M 12,-16 C 12,-7 17,-2 26,-2 C 17,-2 12,3 12,12 C 12,3 7,-2 -2,-2 C 7,-2 12,-7 12,-16 Z" 
      fill="#22399A"
    />
