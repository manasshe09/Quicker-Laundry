    <rect x="281" y="28" width="16" height="96" rx="4" />
    <path 
      d="M 326,63 L 305,88 L 328,124 L 309,124 L 293,98 L 293,86 L 310,63 L 326,63 Z"
    />

    <!-- 'e' -->
    <path 
